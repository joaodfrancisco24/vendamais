<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VENDA MAIS - Sistema de Vendas e Facturação</title>
    <script>
      (function() {
        try {
          var color = localStorage.getItem('vm_theme_color');
          if (!color) {
            var cachedComp = localStorage.getItem('vm_company');
            if (cachedComp) {
              var comp = JSON.parse(cachedComp);
              if (comp && comp.primaryColor) color = comp.primaryColor;
            }
          }
          if (color) {
            var presets = {
              'blue': { p: '#2563eb', h: '#1d4ed8', l: '#eff6ff', b: '#bfdbfe' },
              'emerald': { p: '#059669', h: '#047857', l: '#ecfdf5', b: '#a7f3d0' },
              'purple': { p: '#7c3aed', h: '#6d28d9', l: '#f5f3ff', b: '#ddd6fe' },
              'indigo': { p: '#4f46e5', h: '#4338ca', l: '#eef2ff', b: '#c7d2fe' },
              'teal': { p: '#0d9488', h: '#0f766e', l: '#f0fdf4', b: '#99f6e4' },
              'rose': { p: '#e11d48', h: '#be123c', l: '#fff1f2', b: '#fecdd3' },
              'amber': { p: '#d97706', h: '#b45309', l: '#fffbeb', b: '#fde68a' },
              'slate': { p: '#1e293b', h: '#0f172a', l: '#f8fafc', b: '#cbd5e1' }
            };
            var preset = presets[color];
            if (!preset && color.indexOf('#') === 0) {
              preset = { p: color, h: color, l: color + '15', b: color + '40' };
            }
            if (preset) {
              var root = document.documentElement;
              root.style.setProperty('--brand-primary', preset.p);
              root.style.setProperty('--brand-hover', preset.h);
              root.style.setProperty('--brand-light', preset.l);
              root.style.setProperty('--brand-border', preset.b);
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
